name: MLB Daily Predictions & Performance Tracking

on:
  schedule:
    - cron: '0 12 * * *'      # 12:00 UTC todos los días
  workflow_dispatch:          # Ejecución manual desde móvil

permissions:
  contents: write

concurrency:
  group: mlb
  cancel-in-progress: false

jobs:
  predict-and-track:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.1 \
            requests==2.32.3 joblib==1.4.2

      - name: Run Predictions and EV+ Models
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python mlb_betting.py

      - name: Run Historical Performance Tracker
        run: python track.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predicciones-y-tracking
          path: output/
          if-no-files-found: warn

      - name: Commit predictions and tracking to repo
        run: |
          git config user.name "MLB Bot"
          git config user.email "actions@github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Sin cambios para commit"
          else
            git commit -m "Predicciones y Tracking MLB $(date +%Y-%m-%d)"
            git push || echo "Push falló — revisa permisos"
          fi
